<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis Platform</title>
<style>
:root{--bg:#0b1220;--pn:#121b2e;--tx:#e6edf7;--mu:#8a9ab5;--ln:#223050;--ac:#4f8cff;--ok:#2fbf71;--no:#ef5350;--wa:#f2a93b}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--pn:#fff;--tx:#14213d;--mu:#5b6b88;--ln:#d5dbe8;--ac:#2a5fd6;--ok:#17874d;--no:#c62f2c;--wa:#b36b00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font-size:18px;letter-spacing:.18em;margin:0}nav{display:flex;gap:4px}nav button,.b{background:none;border:1px solid var(--ln);color:var(--tx);padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.rg.on,.b.on{background:var(--ac);border-color:var(--ac);color:#fff}.sp{flex:1}
.flow{display:flex;gap:8px;flex-wrap:wrap}.st{flex:1;min-width:150px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px}.st small{display:block;color:var(--mu)}.st.hi{border-color:var(--ac)}.flow span{align-self:center;color:var(--mu);font-size:22px}
.sl{min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:center;max-width:900px;margin:0 auto}.sl h2{font-size:34px;margin:0 0 10px}.sl p{font-size:20px}.dots{text-align:center;color:var(--mu)}
body.pm{font-size:18px}body.pm .chips,body.pm #mode{display:none}body.pm main{padding:24px 40px}
[hidden]{display:none!important}.g2>.pane{min-height:46vh}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.tile{text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:14px;color:var(--tx);cursor:pointer;font:inherit}.tile:hover{border-color:var(--ac)}.tile b{display:block;font-size:16px}.tile small{display:block;color:var(--mu);margin:2px 0 6px}.tile i{font-style:normal;font-size:12px;color:var(--wa)}
#pop{position:absolute;top:54px;left:12px;z-index:9;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;width:min(620px,92vw)}
dialog{color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:320px}dialog::backdrop{background:rgba(0,0,0,.6)}dialog input{width:100%;padding:8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px}
.chips{font-size:12px;color:var(--mu);padding:6px 20px;border-bottom:1px solid var(--ln)}.chips b{color:var(--tx)}
main{padding:16px 20px}.tab[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k,.card,.pane{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:22px}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:14px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--ln);font:13px Consolas,monospace}.row.w{cursor:pointer}.row.w:hover{background:var(--bg)}
.row i{color:var(--mu);font-style:normal;width:44px}.tag{width:70px;font-weight:700}.Admit{color:var(--ok)}.Deny{color:var(--no)}.ORDER{color:var(--mu)}
.badge{font-size:11px;border:1px solid var(--wa);color:var(--wa);padding:2px 8px;border-radius:99px}.badge.l{border-color:var(--ok);color:var(--ok)}
pre{margin:0;font:14px/1.7 Consolas,monospace;overflow-x:auto}pre span{display:block;padding:0 8px;border-left:3px solid transparent;white-space:pre}
pre span.on{background:rgba(79,140,255,.18);border-left-color:var(--ac)}
table{border-collapse:collapse;width:100%}td{padding:4px 6px;border-bottom:1px solid var(--ln)}td:last-child{text-align:right;font-weight:700}
.res{font-size:26px;font-weight:800;margin:8px 0}.say{font-size:17px;min-height:56px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card h3{margin:0 0 4px;font-size:16px}.card.d{opacity:.5}.card small{color:var(--mu)}
iframe{width:100%;height:calc(100vh - 190px);border:1px solid var(--ln);border-radius:10px;background:#fff}

a.b{text-decoration:none;display:inline-block}
body{background:#fff;color:#14213d}header{border-color:#d5dbe8}h1{color:#14213d}.b{color:#14213d;border-color:#d5dbe8}.chips{background:#fff}iframe{filter:invert(1) hue-rotate(180deg);background:#0b1220;border-color:#d5dbe8}
</style></head><body>
