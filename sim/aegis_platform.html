function ans(s){s=s.toLowerCase();const m=rs(),k=Object.keys(m),d=B.filter(b=>b.r=='Deny'&&!b.local),w=s.match(/warrant\D*(\d+)|#(\d+)/),rt=ROUTES.find(r=>s.includes(r.toLowerCase()));
if(w){const b=B.find(x=>x.id==(w[1]||w[2]));return b?`Warrant #${b.id}: ${b.cust} booked ${b.route} at ${fm(b)}. The ruling was ${b.r} under ${b.cl}, recorded at ${b.t}. It cannot be edited.`:'I cannot find that Warrant yet.'}
if(rt)return `The latest fare for ${rt} is ${R(fare(rt))}.`;

if(/busy|busiest|top route/.test(s)){if(!k.length)return'No bookings yet.';const t=k.sort((a,b)=>m[b].n-m[a].n)[0];return `${t} is busiest, with ${m[t].n} tickets so far.`}

if(/notice|shift/.test(s))return `The shift notice rule (HR-1) needs ${DC.notice} days. The Manager can change it, but never below the global minimum of ${G.notice} days.`;
if(/bus|fleet|workshop/.test(s))return `The fleet rule (FL-1) keeps at least ${DC.fleet} buses in service on every route. A request that would break it goes to the exception queue.`;
